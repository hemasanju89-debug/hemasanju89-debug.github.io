<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎆 Happy New Year 2027</title>

<meta name="description" content="Happy New Year 2027 Wishes">
<meta name="keywords" content="Happy New Year 2027, New Year Wishes">
<meta name="author" content="Satish Kumar">

<link rel="stylesheet" href="style.css">

<script src="https://quge5.com/88/tag.min.js"
        data-zone="264077"
        async
        data-cfasync="false"></script>


</head>

<body>

<!-- Background -->

<div class="background"></div>

<div class="overlay"></div>

<!-- Floating Stars -->

<div id="stars"></div>

<!-- Fireworks Canvas -->

<canvas id="fireworks"></canvas>

<!-- Balloons -->

<div id="balloons"></div>

<!-- Main Card -->

<div class="container">

<div class="glass">

<h1 class="title">

🎆 Happy New Year 2027 🎆

</h1>

<p class="subtitle">

May this New Year bring Happiness, Success and Prosperity.

</p>

<div class="countdown">

<h2>Countdown</h2>

<div id="timer">

00 : 00 : 00 : 00

</div>

</div>

<input

type="text"

id="username"

placeholder="Enter Your Name"

autocomplete="off"

>

<button id="wishBtn">

Create My Wish

</button>

<div id="wishCard">

<h2 id="wishTitle"></h2>
   
<p id="fromName"></p>

<p id="wishMessage"></p>

</div>

<div class="buttons">

    <button id="shareBtn">
        📲 Share on WhatsApp
    </button>

    <button id="musicBtn">
        🎵 Music
    </button>

    <button id="themeBtn">
        🌙 Dark / ☀ Light
    </button>

</div>
</div>

</div>

<!-- Gift -->

<div id="gift">

🎁

</div>

<!-- Confetti -->

<div id="confetti"></div>

<!-- Audio -->

<audio id="bgMusic" loop>

<source src="music/happy.mp3" type="audio/mpeg">
</audio>

<!-- Scripts -->

<script src="script.js"></script>
<script src="fireworks.js"></script>
<script src="confetti.js"></script>
<script src="music.js"></script>
<script src="effects.js"></script>

</body>
</html>
